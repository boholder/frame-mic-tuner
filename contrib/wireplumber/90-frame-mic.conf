# Steam Frame のマイクのフィルター（エコー除去・ノイズ除去）を設定で切れるようにする。
# Valve の microphone-tracker を止めて、自作の frame-mic-tracker.lua を代わりに動かす。
# 置き場所: ~/.config/wireplumber/wireplumber.conf.d/90-frame-mic.conf
# 元に戻すには、このファイルを消して WirePlumber を再起動する。

wireplumber.components = [
  {
    name = "@SCRIPT_PATH@",
    type = "script/lua",
    provides = "custom.frame-mic-tracker"
  }
]

wireplumber.profiles = {
  main = {
    "steamos.microphone-tracker" = "disabled"
    "custom.frame-mic-tracker" = "required"
  }
}

wireplumber.settings.schema = {
  frame-mic.echo-cancel = {
    name = "Frame mic: echo cancellation"
    description = "Use Valve's echo cancellation on the Steam Frame microphone"
    type = "bool"
    default = true
  }
  frame-mic.noise-suppression = {
    name = "Frame mic: noise suppression"
    description = "Use Valve's noise suppression (voice gate) on the Steam Frame microphone"
    type = "bool"
    default = false
  }
}
